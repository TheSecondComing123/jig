[project]
name = "jig"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "TheSecondComing123", email = "78659211+TheSecondComing123@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "lark>=1.3.1",
]

[project.scripts]
jig = "jig:main"

[build-system]
